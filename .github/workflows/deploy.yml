# Publishes the site on every push to main: builds it and pushes dist/ to the gh-pages branch, which
# GitHub Pages serves at kopenkin.tech. Same setup as earlier versions, so Pages settings don't change.
name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Astro site
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: pnpm@10

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          cname: kopenkin.tech
